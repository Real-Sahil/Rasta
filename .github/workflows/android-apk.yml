name: Android APK

# Builds a debug APK of the Android prototype (Capacitor shell around the production web app).
# Download it from the run's Artifacts, copy it to a phone and install it (allow "install unknown apps").
on:
  workflow_dispatch:
  pull_request:
    paths: ['android/**', 'capacitor.config.ts', '.github/workflows/android-apk.yml']

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: buraq-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
