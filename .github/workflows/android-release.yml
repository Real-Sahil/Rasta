name: Android release (AAB)

# Builds a signed Android App Bundle for Google Play, by hand. Needs mobile/android/upload-key.p12.gpg (from the
# "Create Android upload key" workflow) and the secret ANDROID_KEYSTORE_PASSWORD. The version code is this
# workflow's run number, so every build is higher than the last. Upload the .aab from the artifact to Play Console
# (the first upload of a new app must be done by hand in the Console).
on:
  workflow_dispatch:

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Decrypt the upload key
        env:
          PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -f android/upload-key.p12.gpg || { echo "::error::Run the 'Create Android upload key' workflow first."; exit 1; }
          umask 077
          printf '%s' "$PW" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
            -d -o "$RUNNER_TEMP/upload-key.p12" android/upload-key.p12.gpg
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload-key.p12" >> "$GITHUB_ENV"
      - run: flutter pub get
      - run: flutter test
      - name: Build signed bundle
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: flutter build appbundle --release --build-number ${{ github.run_number }}
      - name: Check the bundle is signed with the upload key
        run: |
          keytool -printcert -jarfile build/app/outputs/bundle/release/app-release.aab | grep -q "Owner: CN=Buraq Pakistan" \
            || { echo "::error::Bundle is not signed with the upload key."; exit 1; }
      - name: Remove the decrypted key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload-key.p12"
      - uses: actions/upload-artifact@v4
        with:
          name: buraq-release-aab-${{ github.run_number }}
          path: mobile/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
