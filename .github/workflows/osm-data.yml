name: Refresh OSM data

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 1 * *' # monthly

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fetch Lahore transit stops, hospitals and fuel stations from OpenStreetMap
        run: npm run data:osm
      - name: Commit refreshed data to main
        run: |
          if git diff --quiet -- src/data/osm; then echo "No changes"; exit 0; fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/osm
          git commit -m "data: refresh OpenStreetMap extracts"
          git push origin HEAD:main
