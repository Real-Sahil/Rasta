name: Refresh OSM data

on:
  workflow_dispatch:
    inputs:
      only:
        description: 'Comma-separated datasets to fetch (orangeline,metrobus,hospitals,fuel,lines); empty = all'
        required: false
        default: ''
  schedule:
    - cron: '17 3 1 * *' # monthly

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fetch Lahore stops/hospitals/fuel and metro lines of other cities from OpenStreetMap
        run: npm run data:osm
        env:
          OSM_ONLY: ${{ github.event.inputs.only }}
      - name: Copy the extracts into the Flutter app (a test fails if the copies differ)
        run: node mobile/tool/sync_osm.mjs
      - name: Commit refreshed data to main
        run: |
          # status (not diff): the first run creates brand-new, untracked files
          if [ -z "$(git status --porcelain -- src/data/osm mobile/assets/osm)" ]; then echo "No changes"; exit 0; fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/osm mobile/assets/osm
          git commit -m "data: refresh OpenStreetMap extracts"
          git pull --rebase origin main
          git push origin HEAD:main
