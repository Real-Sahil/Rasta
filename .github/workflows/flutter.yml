name: Flutter app

# Analyze + test the Dart app in mobile/, and build Android release APKs, one per phone chip (artifact).
# iOS: a no-codesign build on macOS proves it compiles; an installable IPA needs an Apple developer account.
on:
  workflow_dispatch:
  pull_request:
    paths: ['mobile/**', '.github/workflows/flutter.yml']
  push:
    branches: [main]
    paths: ['mobile/**', '.github/workflows/flutter.yml']

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # Release, not debug: a debug build runs interpreted with assertions on and is several times slower on a phone.
      # Without the upload key it is signed with the debug key, so it installs for testing but is not a store build.
      # One APK per phone chip instead of one universal APK carrying all three: each is a fraction of the size, so it
      # downloads, installs and starts faster on cheap phones. arm64-v8a suits most phones; armeabi-v7a is for old or
      # budget phones (including Android Go) that run 32-bit Android. Play builds from the AAB split this by itself.
      - run: flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64
      - run: ls -l build/app/outputs/flutter-apk/
      - uses: actions/upload-artifact@v4
        with:
          name: buraq-flutter-apk
          path: |
            mobile/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            mobile/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          if-no-files-found: error

  ios:
    runs-on: macos-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --debug --no-codesign
