name: Flutter app

# Analyze + test the Dart app in mobile/, and build an Android debug APK (artifact).
# iOS: a no-codesign build on macOS proves it compiles; an installable IPA needs an Apple developer account.
on:
  workflow_dispatch:
  pull_request:
    paths: ['mobile/**', '.github/workflows/flutter.yml']
  push:
    branches: [main]
    paths: ['mobile/**', '.github/workflows/flutter.yml']

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: buraq-flutter-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

  ios:
    runs-on: macos-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --debug --no-codesign
